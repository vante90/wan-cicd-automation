hostname WAN-D2
!
interface GigabitEthernet0/0
 description to WAN-D1 (10.0.0.24/30)
 ip address 10.0.0.26 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to WAN-B1 (10.0.0.28/30)
 ip address 10.0.0.29 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.8 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.8.1 255.255.255.0
!
ip route 10.1.1.7 255.255.255.255 10.0.0.25
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65004
 bgp router-id 10.1.1.8
 bgp log-neighbor-changes
 network 172.16.8.0 mask 255.255.255.0
 neighbor 10.1.1.7 remote-as 65004
 neighbor 10.1.1.7 description iBGP
 neighbor 10.1.1.7 update-source Loopback0
 neighbor 10.1.1.7 next-hop-self
 neighbor 10.0.0.30 remote-as 65002
 neighbor 10.0.0.30 description eBGP WAN-B1
 neighbor 10.0.0.30 route-map FROM-B1 in
!
end
