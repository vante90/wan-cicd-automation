hostname WAN-C1
!
interface GigabitEthernet0/1
 description to WAN-A1 (10.0.0.8/30)
 ip address 10.0.0.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description to WAN-C2 (10.0.0.32/30)
 ip address 10.0.0.33 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description to WAN-E1 (10.0.0.40/30)
 ip address 10.0.0.41 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description to WAN-E2 (10.0.0.48/30)
 ip address 10.0.0.49 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.5 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.5.1 255.255.255.0
!
ip route 10.1.1.6 255.255.255.255 10.0.0.34
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65003
 bgp router-id 10.1.1.5
 bgp log-neighbor-changes
 network 172.16.5.0 mask 255.255.255.0
 neighbor 10.1.1.6 remote-as 65003
 neighbor 10.1.1.6 description iBGP
 neighbor 10.1.1.6 update-source Loopback0
 neighbor 10.1.1.6 next-hop-self
 neighbor 10.0.0.9 remote-as 65001
 neighbor 10.0.0.9 description eBGP WAN-A1
 neighbor 10.0.0.42 remote-as 65005
 neighbor 10.0.0.42 description eBGP WAN-E1
 neighbor 10.0.0.50 remote-as 65005
 neighbor 10.0.0.50 description eBGP WAN-E2
!
end
