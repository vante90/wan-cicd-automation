hostname WAN-A1
!
interface GigabitEthernet0/0
 description to WAN-A2 (10.0.0.0/30)
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description to WAN-B1 (10.0.0.4/30)
 ip address 10.0.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to WAN-C1 (10.0.0.8/30)
 ip address 10.0.0.9 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.1 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.1.1 255.255.255.0
!
ip route 10.1.1.2 255.255.255.255 10.0.0.2
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65001
 bgp router-id 10.1.1.1
 bgp log-neighbor-changes
 network 172.16.1.0 mask 255.255.255.0
 neighbor 10.1.1.2 remote-as 65001
 neighbor 10.1.1.2 description iBGP
 neighbor 10.1.1.2 update-source Loopback0
 neighbor 10.1.1.2 next-hop-self
 neighbor 10.0.0.6 remote-as 65002
 neighbor 10.0.0.6 description eBGP WAN-B1
 neighbor 10.0.0.6 route-map FROM-B1 in
 neighbor 10.0.0.10 remote-as 65003
 neighbor 10.0.0.10 description eBGP WAN-C1
!
end
