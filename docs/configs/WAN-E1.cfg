hostname WAN-E1
!
interface GigabitEthernet0/3
 description to WAN-C1 (10.0.0.40/30)
 ip address 10.0.0.42 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to WAN-B2 (10.0.0.44/30)
 ip address 10.0.0.45 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description to WAN-E2 (10.0.0.52/30)
 ip address 10.0.0.54 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.9 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.9.1 255.255.255.0
!
ip route 10.1.1.10 255.255.255.255 10.0.0.53
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65005
 bgp router-id 10.1.1.9
 bgp log-neighbor-changes
 network 172.16.9.0 mask 255.255.255.0
 neighbor 10.1.1.10 remote-as 65005
 neighbor 10.1.1.10 description iBGP
 neighbor 10.1.1.10 update-source Loopback0
 neighbor 10.1.1.10 next-hop-self
 neighbor 10.0.0.41 remote-as 65003
 neighbor 10.0.0.41 description eBGP WAN-C1
 neighbor 10.0.0.46 remote-as 65002
 neighbor 10.0.0.46 description eBGP WAN-B2
 neighbor 10.0.0.46 route-map FROM-B2 in
!
end
