hostname WAN-E2
!
interface GigabitEthernet0/2
 description to WAN-C1 (10.0.0.48/30)
 ip address 10.0.0.50 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description to WAN-E1 (10.0.0.52/30)
 ip address 10.0.0.53 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description to WAN-B1 (10.0.0.56/30)
 ip address 10.0.0.57 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.10 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.10.1 255.255.255.0
!
ip route 10.1.1.9 255.255.255.255 10.0.0.54
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65005
 bgp router-id 10.1.1.10
 bgp log-neighbor-changes
 network 172.16.10.0 mask 255.255.255.0
 neighbor 10.1.1.9 remote-as 65005
 neighbor 10.1.1.9 description iBGP
 neighbor 10.1.1.9 update-source Loopback0
 neighbor 10.1.1.9 next-hop-self
 neighbor 10.0.0.49 remote-as 65003
 neighbor 10.0.0.49 description eBGP WAN-C1
 neighbor 10.0.0.58 remote-as 65002
 neighbor 10.0.0.58 description eBGP WAN-B1
 neighbor 10.0.0.58 route-map FROM-B1 in
!
end
