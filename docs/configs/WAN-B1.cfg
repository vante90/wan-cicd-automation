hostname WAN-B1
!
interface GigabitEthernet0/2
 description to WAN-A1 (10.0.0.4/30)
 ip address 10.0.0.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description to WAN-B2 (10.0.0.16/30)
 ip address 10.0.0.17 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to WAN-D2 (10.0.0.28/30)
 ip address 10.0.0.30 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description to WAN-C2 (10.0.0.36/30)
 ip address 10.0.0.38 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description to WAN-E2 (10.0.0.56/30)
 ip address 10.0.0.58 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.3 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.3.1 255.255.255.0
!
ip route 10.1.1.4 255.255.255.255 10.0.0.18
ip route 0.0.0.0 0.0.0.0 Null0 220
!
route-map FROM-EBGP permit 10
 set local-preference 120
!
router bgp 65002
 bgp router-id 10.1.1.3
 bgp log-neighbor-changes
 network 172.16.3.0 mask 255.255.255.0
 network 0.0.0.0
 neighbor 10.1.1.4 remote-as 65002
 neighbor 10.1.1.4 description iBGP
 neighbor 10.1.1.4 update-source Loopback0
 neighbor 10.1.1.4 next-hop-self
 neighbor 10.0.0.5 remote-as 65001
 neighbor 10.0.0.5 description eBGP WAN-A1
 neighbor 10.0.0.5 route-map FROM-EBGP in
 neighbor 10.0.0.29 remote-as 65004
 neighbor 10.0.0.29 description eBGP WAN-D2
 neighbor 10.0.0.29 route-map FROM-EBGP in
 neighbor 10.0.0.37 remote-as 65003
 neighbor 10.0.0.37 description eBGP WAN-C2
 neighbor 10.0.0.37 route-map FROM-EBGP in
 neighbor 10.0.0.57 remote-as 65005
 neighbor 10.0.0.57 description eBGP WAN-E2
 neighbor 10.0.0.57 route-map FROM-EBGP in
!
end
