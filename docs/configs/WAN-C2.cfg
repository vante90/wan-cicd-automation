hostname WAN-C2
!
interface GigabitEthernet0/0
 description to WAN-C1 (10.0.0.32/30)
 ip address 10.0.0.34 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description to WAN-B1 (10.0.0.36/30)
 ip address 10.0.0.37 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.6 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.6.1 255.255.255.0
!
ip route 10.1.1.5 255.255.255.255 10.0.0.33
!
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
!
route-map FROM-B1 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
route-map FROM-B1 permit 20
!
route-map FROM-B2 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 150
route-map FROM-B2 permit 20
!
router bgp 65003
 bgp router-id 10.1.1.6
 bgp log-neighbor-changes
 network 172.16.6.0 mask 255.255.255.0
 neighbor 10.1.1.5 remote-as 65003
 neighbor 10.1.1.5 description iBGP
 neighbor 10.1.1.5 update-source Loopback0
 neighbor 10.1.1.5 next-hop-self
 neighbor 10.0.0.38 remote-as 65002
 neighbor 10.0.0.38 description eBGP WAN-B1
 neighbor 10.0.0.38 route-map FROM-B1 in
!
end
