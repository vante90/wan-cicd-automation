hostname WAN-B2
!
interface GigabitEthernet0/2
 description to WAN-A2 (10.0.0.12/30)
 ip address 10.0.0.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description to WAN-B1 (10.0.0.16/30)
 ip address 10.0.0.18 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description to WAN-E1 (10.0.0.44/30)
 ip address 10.0.0.46 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id and iBGP peering
 ip address 10.1.1.4 255.255.255.255
!
interface Loopback1
 description announced /24
 ip address 172.16.4.1 255.255.255.0
!
ip route 10.1.1.3 255.255.255.255 10.0.0.17
ip route 0.0.0.0 0.0.0.0 Null0 220
!
route-map FROM-EBGP permit 10
 set local-preference 110
!
router bgp 65002
 bgp router-id 10.1.1.4
 bgp log-neighbor-changes
 network 172.16.4.0 mask 255.255.255.0
 network 0.0.0.0
 neighbor 10.1.1.3 remote-as 65002
 neighbor 10.1.1.3 description iBGP
 neighbor 10.1.1.3 update-source Loopback0
 neighbor 10.1.1.3 next-hop-self
 neighbor 10.0.0.13 remote-as 65001
 neighbor 10.0.0.13 description eBGP WAN-A2
 neighbor 10.0.0.13 route-map FROM-EBGP in
 neighbor 10.0.0.45 remote-as 65005
 neighbor 10.0.0.45 description eBGP WAN-E1
 neighbor 10.0.0.45 route-map FROM-EBGP in
!
end
