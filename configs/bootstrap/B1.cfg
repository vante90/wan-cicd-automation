! B1 - AS 65002 - plane 1 - initial configuration
! Paste stage by stage and verify after each stage. Edit CHANGE_ME in stage 1 first.
! Stage 6 needs the site LAN switch cabled to Gi0/7 first.
!
! ===== STAGE 1: base and SSH =====
hostname B1
no ip domain lookup
ip domain name lab.local
username admin privilege 15 secret CHANGE_ME
ip ssh version 2
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 0 0
exit
! Wait for the key generation to finish before pasting the next stage
crypto key generate rsa modulus 2048
!
! ===== STAGE 2: interfaces (with BFD timers) =====
interface Loopback0
 description Router ID / in-band management
 ip address 10.255.2.1 255.255.255.255
interface GigabitEthernet0/0
 description unused
 shutdown
interface GigabitEthernet0/1
 description intra-site to B2 Gi0/1
 ip address 10.2.0.0 255.255.255.254
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
interface GigabitEthernet0/2
 description inter-site to A1
 ip address 10.0.1.1 255.255.255.254
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
interface GigabitEthernet0/3
 description inter-site to C1
 ip address 10.0.1.4 255.255.255.254
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
exit
ip route 10.2.0.0 255.255.0.0 Null0
ip route 10.255.2.0 255.255.255.0 Null0
!
! ===== STAGE 3: OSPF (area 0, inside the site, with BFD) =====
router ospf 1
 router-id 10.255.2.1
 passive-interface Loopback0
 default-information originate metric 10 metric-type 1
exit
interface Loopback0
 ip ospf 1 area 0
interface GigabitEthernet0/1
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf bfd
exit
!
! ===== STAGE 4: prefix-lists and route-maps (BGP policy) =====
ip prefix-list PL-OUT-B seq 10 permit 10.2.0.0/16
ip prefix-list PL-OUT-B seq 20 permit 10.255.2.0/24
ip prefix-list PL-IN-A seq 10 permit 0.0.0.0/0
ip prefix-list PL-IN-A seq 20 permit 10.1.0.0/16
ip prefix-list PL-IN-A seq 30 permit 10.255.0.0/24
ip prefix-list PL-IN-A seq 40 permit 10.255.1.0/24
ip prefix-list PL-IN-C seq 10 permit 10.3.0.0/16
ip prefix-list PL-IN-C seq 20 permit 10.255.3.0/24
ip prefix-list PL-CLASS1 seq 10 permit 0.0.0.0/0
ip prefix-list PL-CLASS1 seq 20 permit 10.255.0.0/24
ip prefix-list PL-CLASS1 seq 30 permit 10.255.1.0/24
ip prefix-list PL-CLASS1 seq 40 permit 10.255.2.0/24
ip prefix-list PL-CLASS1 seq 50 permit 10.255.3.0/24
ip prefix-list PL-CLASS2 seq 10 permit 10.1.0.0/16
ip prefix-list PL-CLASS2 seq 20 permit 10.2.0.0/16
ip prefix-list PL-CLASS2 seq 30 permit 10.3.0.0/16
route-map RM-IN-PLANE1 permit 10
 match ip address prefix-list PL-CLASS1
 set local-preference 200
route-map RM-IN-PLANE1 permit 20
 match ip address prefix-list PL-CLASS2
 set local-preference 100
!
! ===== STAGE 5: BGP (AS 65002) =====
router bgp 65002
 bgp router-id 10.255.2.1
 bgp log-neighbor-changes
 neighbor 10.255.2.2 remote-as 65002
 neighbor 10.255.2.2 description iBGP B2
 neighbor 10.255.2.2 update-source Loopback0
 neighbor 10.255.2.2 timers 3 9
 neighbor 10.0.1.0 remote-as 65001
 neighbor 10.0.1.0 description eBGP A1
 neighbor 10.0.1.0 fall-over bfd
 neighbor 10.0.1.5 remote-as 65003
 neighbor 10.0.1.5 description eBGP C1
 neighbor 10.0.1.5 fall-over bfd
 address-family ipv4
  network 10.2.0.0 mask 255.255.0.0
  network 10.255.2.0 mask 255.255.255.0
  neighbor 10.255.2.2 activate
  neighbor 10.255.2.2 next-hop-self
  neighbor 10.0.1.0 activate
  neighbor 10.0.1.0 prefix-list PL-OUT-B out
  neighbor 10.0.1.0 prefix-list PL-IN-A in
  neighbor 10.0.1.0 route-map RM-IN-PLANE1 in
  neighbor 10.0.1.5 activate
  neighbor 10.0.1.5 prefix-list PL-OUT-B out
  neighbor 10.0.1.5 prefix-list PL-IN-C in
  neighbor 10.0.1.5 route-map RM-IN-PLANE1 in
 exit-address-family
exit
!
! ===== STAGE 6: site LAN and HSRP (Gi0/7) =====
interface GigabitEthernet0/7
 description site LAN (HSRP gateway)
 ip address 10.2.1.2 255.255.255.0
 standby version 2
 standby 1 ip 10.2.1.1
 standby 1 priority 110
 standby 1 preempt
 standby 1 timers 1 3
 ip ospf 1 area 0
 no shutdown
exit
router ospf 1
 passive-interface GigabitEthernet0/7
end
write memory
