! C1 - AS 65003 - initial configuration
! Paste stage by stage and verify after each stage. Edit CHANGE_ME in stage 1 first.
!
! ===== STAGE 1: base and SSH =====
hostname C1
no ip domain lookup
ip domain name lab.local
username admin privilege 15 secret CHANGE_ME
ip ssh version 2
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 0 0
exit
! Wait for the key generation to finish before pasting the next stage
crypto key generate rsa modulus 2048
!
! ===== STAGE 2: interfaces =====
interface Loopback0
 description Router ID / in-band management
 ip address 10.255.3.1 255.255.255.255
interface GigabitEthernet0/0
 description unused
 shutdown
interface GigabitEthernet0/1
 description intra-site to C2 Gi0/1
 ip address 10.3.0.0 255.255.255.254
 no shutdown
interface GigabitEthernet0/2
 description inter-site to A1
 ip address 10.0.1.3 255.255.255.254
 no shutdown
interface GigabitEthernet0/3
 description inter-site to B1
 ip address 10.0.1.5 255.255.255.254
 no shutdown
exit
ip route 10.3.0.0 255.255.0.0 Null0
ip route 10.255.3.0 255.255.255.0 Null0
!
! ===== STAGE 3: OSPF (area 0, inside the site) =====
router ospf 1
 router-id 10.255.3.1
 passive-interface Loopback0
 default-information originate
exit
interface Loopback0
 ip ospf 1 area 0
interface GigabitEthernet0/1
 ip ospf 1 area 0
 ip ospf network point-to-point
exit
!
! ===== STAGE 4: prefix-lists (BGP policy) =====
ip prefix-list PL-OUT-C seq 10 permit 10.3.0.0/16
ip prefix-list PL-OUT-C seq 20 permit 10.255.3.0/24
ip prefix-list PL-IN-A seq 10 permit 0.0.0.0/0
ip prefix-list PL-IN-A seq 20 permit 10.1.0.0/16
ip prefix-list PL-IN-A seq 30 permit 10.255.0.0/24
ip prefix-list PL-IN-A seq 40 permit 10.255.1.0/24
ip prefix-list PL-IN-B seq 10 permit 10.2.0.0/16
ip prefix-list PL-IN-B seq 20 permit 10.255.2.0/24
!
! ===== STAGE 5: BGP (AS 65003) =====
router bgp 65003
 bgp router-id 10.255.3.1
 bgp log-neighbor-changes
 neighbor 10.255.3.2 remote-as 65003
 neighbor 10.255.3.2 description iBGP C2
 neighbor 10.255.3.2 update-source Loopback0
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 description eBGP A1
 neighbor 10.0.1.4 remote-as 65002
 neighbor 10.0.1.4 description eBGP B1
 address-family ipv4
  network 10.3.0.0 mask 255.255.0.0
  network 10.255.3.0 mask 255.255.255.0
  neighbor 10.255.3.2 activate
  neighbor 10.255.3.2 next-hop-self
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 prefix-list PL-OUT-C out
  neighbor 10.0.1.2 prefix-list PL-IN-A in
  neighbor 10.0.1.4 activate
  neighbor 10.0.1.4 prefix-list PL-OUT-C out
  neighbor 10.0.1.4 prefix-list PL-IN-B in
 exit-address-family
end
write memory
